[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-a2rl-training"
version = "0.1.0"
description = "An AVLite-native A2RL-style racing stack using Project Chrono, MPC, Gymnasium, and SB3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "avlite>=0.5.3,<0.6",
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "gymnasium>=0.29",
  "osqp>=1.0",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.0", "tensorboard>=2.12"]
dev = ["pytest>=7.0"]

[project.scripts]
aa = "chrono_a2rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avlite_a2rl = ["README.md", "requirements.txt"]

[tool.setuptools.data-files]
"share/chrono_a2rl/avlite_profiles" = ["avlite_profiles/*.yaml"]
"share/chrono_a2rl/avlite_data" = ["avlite_data/*.json", "avlite_data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:launch_testing -p no:launch_ros"
